name: Native infrastructure
on:
  push:
    branches: ['agent/**']
    paths: ['App.tsx', 'index.ts', 'global.css', 'metro.config.js', 'babel.config.js', 'src/**', 'modules/**', 'expo-env.d.ts', 'scripts/**', 'tests/**', '.agent/schemas/**', 'native/**', 'Gemfile', 'Gemfile.lock', 'package.json', 'package-lock.json', 'app.json', 'tsconfig.json', '.github/workflows/**', 'docs/decisions/technology-stack.md', 'docs/acceptance/t3-*.json']
  pull_request:
    paths: ['App.tsx', 'index.ts', 'global.css', 'metro.config.js', 'babel.config.js', 'src/**', 'modules/**', 'expo-env.d.ts', 'scripts/**', 'tests/**', '.agent/schemas/**', 'native/**', 'Gemfile', 'Gemfile.lock', 'package.json', 'package-lock.json', 'app.json', 'tsconfig.json', '.github/workflows/**', 'docs/decisions/technology-stack.md', 'docs/acceptance/t3-*.json']
  workflow_dispatch:
    inputs:
      stage:
        description: 'Scope: all (default), build, sim, ipa'
        required: false
        default: 'all'
        type: choice
        options: [all, build, sim, ipa]
      app_run_id:
        description: 'Reuse device/sim app artifact from this earlier run id (sim/ipa only)'
        required: false
        default: ''
        type: string
      app_sha:
        description: 'Required when app_run_id is set: the exact commit the artifact must be built from'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read   # download-artifact --run-id for scoped reruns
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18
        with:
          ruby-version: '3.3.8'
          bundler: '2.6.9'
          bundler-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npm run export:ios

  native-build:
    needs: checks
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.app_run_id == '' ||
      github.event.inputs.stage == 'all' ||
      github.event.inputs.stage == 'build'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXPO_NO_TELEMETRY: '1'
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18
        with:
          ruby-version: '3.3.8'
          bundler: '2.6.9'
          bundler-cache: false
      - name: Record private native environment
        run: |
          bash scripts/ci/run-step.sh environment bash -euo pipefail -c '
            mkdir -p "$RUNNER_TEMP/native-private"
            sw_vers
            xcodebuild -version
            node --version
            npm --version
            ruby --version
            bundle _2.6.9_ --version
          '
      - name: Install locked JavaScript dependencies
        run: bash scripts/ci/run-step.sh npm npm ci --no-audit --no-fund
      - name: Run canonical tests including real POSIX dependency aliases
        run: npm test
      - name: Generate native project and deny template network exemption
        run: |
          bash scripts/ci/run-step.sh prebuild bash -euo pipefail -c '
            npm pack expo-template-bare-minimum@58.0.35 --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/native-private"
            python3 scripts/ci/verify-template.py "$RUNNER_TEMP/native-private/expo-template-bare-minimum-58.0.35.tgz"
            npx expo prebuild --platform ios --no-install --template "$RUNNER_TEMP/native-private/expo-template-bare-minimum-58.0.35.tgz"
            python3 scripts/ci/configure-native.py
          '
          # Xcode script phases run with a minimal PATH that lacks the runner's
          # hostedtoolcache node (it only joins PATH via GITHUB_PATH). The template's
          # .xcode.env does `export NODE_BINARY=$(command -v node)`, which resolves to
          # nothing inside xcodebuild, so every node-driven phase fails (exit 65).
          # Write .xcode.env.local with the absolute binary; it is not versioned and
          # overrides the global env file.
          printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Restore exact reviewed dependency downloads
        id: native-cache
        if: hashFiles('native/lock-review.json') != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-macos26-ruby3.3.8-pod1.16.2-bundle2.6.9-${{ hashFiles('Gemfile', 'Gemfile.lock', 'package-lock.json', 'ios/Podfile', 'scripts/ci/verify-template.py', 'native/dependency-policy.json', 'native/Podfile.lock', 'native/lock-review.json', 'native/prebuilt-dependencies.json') }}
          path: |
            ~/Library/Caches/CocoaPods/Pods
            ~/.cocoapods/repos/trunk
            ~/Library/Caches/ReactNative
            ios/Pods/ReactNativeCore-artifacts
            ios/Pods/ReactNativeDependencies-artifacts
            ios/Pods/hermes-engine-artifacts
      - name: Resolve reviewed native dependencies or stop at bootstrap gate
        id: pods
        run: bash scripts/ci/run-step.sh pods bash scripts/ci/install-pods.sh
      - name: Save dependency downloads only after full lock and checksum verification
        if: steps.pods.outputs.result == 'passed' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-macos26-ruby3.3.8-pod1.16.2-bundle2.6.9-${{ hashFiles('Gemfile', 'Gemfile.lock', 'package-lock.json', 'ios/Podfile', 'scripts/ci/verify-template.py', 'native/dependency-policy.json', 'native/Podfile.lock', 'native/lock-review.json', 'native/prebuilt-dependencies.json') }}
          path: |
            ~/Library/Caches/CocoaPods/Pods
            ~/.cocoapods/repos/trunk
            ~/Library/Caches/ReactNative
            ios/Pods/ReactNativeCore-artifacts
            ios/Pods/ReactNativeDependencies-artifacts
            ios/Pods/hermes-engine-artifacts
      - name: Build self-contained Release simulator app
        run: |
          set +e
          bash scripts/ci/run-step.sh simulator-build xcodebuild -workspace ios/PiGUIMobile.xcworkspace -scheme PiGUIMobile -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/native-private/simulator.xcresult" build
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci/xcresult-schema.py "$RUNNER_TEMP/native-private/simulator.xcresult" || true
            python3 scripts/ci/xcresult-issues.py "$RUNNER_TEMP/native-private/simulator.xcresult" > "$RUNNER_TEMP/native-private/logs/simulator-build-xcresult.json" || true
          fi
          exit "$status"
      - name: Build unsigned device app without Apple credentials
        run: |
          bash scripts/ci/run-step.sh device-build xcodebuild -workspace ios/PiGUIMobile.xcworkspace -scheme PiGUIMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package provenance-bound build handoffs
        id: handoff
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/handoff"
          mkdir -p "$HANDOFF"
          tar -cf "$HANDOFF/sim-app.tar" -C build/simulator/Build/Products/Release-iphonesimulator PiGUIMobile.app
          python3 scripts/ci/write-handoff.py sim "$HANDOFF/sim-app.tar" "$HANDOFF/sim-app-manifest.json"
          tar -cf "$HANDOFF/device-app.tar" -C build/device/Build/Products/Release-iphoneos PiGUIMobile.app
          python3 scripts/ci/write-handoff.py device "$HANDOFF/device-app.tar" "$HANDOFF/device-app-manifest.json"
      - name: Upload simulator app handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: success()
        with:
          name: sim-app-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/handoff/sim-app.tar
            ${{ runner.temp }}/handoff/sim-app-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload device app handoff
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: success()
        with:
          name: device-app-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/handoff/device-app.tar
            ${{ runner.temp }}/handoff/device-app-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Collect only sanitized synthetic evidence
        id: evidence
        if: always()
        run: python3 scripts/ci/collect-evidence.py
      - name: Upload explicit synthetic evidence whitelist
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evidence-build-${{ github.run_id }}
          path: |
            artifacts/reports/steps.json
            artifacts/reports/diagnostics.json
            artifacts/reports/environment.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload safe lock candidates for review only
        if: always() && steps.pods.outputs.result == 'bootstrap-required'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-lock-bootstrap-review-required-${{ github.run_id }}
          path: |
            artifacts/lock-candidates/Gemfile.lock
            artifacts/lock-candidates/Podfile.lock
            artifacts/lock-candidates/prebuilt-dependencies.json
            artifacts/lock-candidates/review.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove private runner material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/native-private" "$RUNNER_TEMP/handoff"

  sim-acceptance:
    needs: [native-build]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'sim') &&
      (needs.native-build.result == 'success' || github.event.inputs.app_run_id != '')
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Select iOS simulators
        run: |
          bash scripts/ci/run-step.sh environment bash -euo pipefail -c '
            mkdir -p "$RUNNER_TEMP/native-private"
            xcrun simctl list devices available --json > "$RUNNER_TEMP/native-private/simulators.json"
            node scripts/ci/select-simulators.mjs
          '
      - name: Download simulator app handoff
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sim-app-${{ inputs.app_run_id || github.run_id }}
          path: ${{ runner.temp }}/handoff
          run-id: ${{ inputs.app_run_id || github.run_id }}
      - name: Verify handoff provenance and digest
        run: |
          mkdir -p "$RUNNER_TEMP/native-private"
          python3 scripts/ci/verify-handoff.py "$RUNNER_TEMP/handoff/sim-app-manifest.json" "$RUNNER_TEMP/handoff/sim-app.tar" "${{ inputs.app_run_id || github.run_id }}" "${{ inputs.app_sha || github.sha }}"
          # Evidence for this run may only certify the commit this run actually
          # reports: the exercised binary must have been built from github.sha,
          # regardless of which earlier run produced it.
          python3 -c "import json,sys,os;m=json.load(open('$RUNNER_TEMP/handoff/sim-app-manifest.json'));sys.exit(0 if m['head_sha']==os.environ['GITHUB_SHA'] else 1)"
          tar -xf "$RUNNER_TEMP/handoff/sim-app.tar" -C "$RUNNER_TEMP"
      - name: iPhone native interactions and appearance
        run: bash scripts/ci/run-step.sh iphone bash -c 'APP_PATH="$RUNNER_TEMP/PiGUIMobile.app" bash scripts/ci/simulator.sh "$IPHONE_UDID" iphone'
      - name: iPad native interactions and appearance
        if: always()
        run: bash scripts/ci/run-step.sh ipad bash -c 'APP_PATH="$RUNNER_TEMP/PiGUIMobile.app" bash scripts/ci/simulator.sh "$IPAD_UDID" ipad'
      - name: Collect only sanitized synthetic evidence
        id: evidence
        if: always()
        run: python3 scripts/ci/collect-evidence.py
      - name: Upload explicit synthetic evidence whitelist
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evidence-sim-${{ github.run_id }}
          path: |
            artifacts/reports/steps.json
            artifacts/reports/diagnostics.json
            artifacts/reports/environment.json
            artifacts/screenshots/iphone/00-shell-home.png
            artifacts/screenshots/iphone/01-native-glass.png
            artifacts/screenshots/iphone/02-interactions.png
            artifacts/screenshots/iphone/03-navigation.png
            artifacts/screenshots/iphone/04-keyboard-visible.png
            artifacts/screenshots/iphone/05-native-motion.png
            artifacts/screenshots/iphone/07-shell-sessions.png
            artifacts/screenshots/iphone/08-shell-conversation.png
            artifacts/screenshots/iphone/09-approvals.png
            artifacts/screenshots/iphone/10-approval-detail.png
            artifacts/screenshots/iphone/dark/home.png
            artifacts/screenshots/iphone/dark/conversation.png
            artifacts/screenshots/iphone/dark/appearance.png
            artifacts/screenshots/iphone/accessibility/home.png
            artifacts/screenshots/iphone/accessibility/conversation.png
            artifacts/screenshots/iphone/accessibility/reduce-transparency.png
            artifacts/screenshots/iphone/accessibility/dynamic-type.png
            artifacts/screenshots/iphone/final.png
            artifacts/screenshots/iphone/failure.png
            artifacts/screenshots/ipad/00-shell-home.png
            artifacts/screenshots/ipad/01-native-glass.png
            artifacts/screenshots/ipad/02-interactions.png
            artifacts/screenshots/ipad/03-navigation.png
            artifacts/screenshots/ipad/04-keyboard-visible.png
            artifacts/screenshots/ipad/05-native-motion.png
            artifacts/screenshots/ipad/07-shell-sessions.png
            artifacts/screenshots/ipad/08-shell-conversation.png
            artifacts/screenshots/ipad/09-approvals.png
            artifacts/screenshots/ipad/10-approval-detail.png
            artifacts/screenshots/ipad/dark/home.png
            artifacts/screenshots/ipad/dark/conversation.png
            artifacts/screenshots/ipad/dark/appearance.png
            artifacts/screenshots/ipad/accessibility/home.png
            artifacts/screenshots/ipad/accessibility/conversation.png
            artifacts/screenshots/ipad/accessibility/reduce-transparency.png
            artifacts/screenshots/ipad/accessibility/dynamic-type.png
            artifacts/screenshots/ipad/final.png
            artifacts/screenshots/ipad/failure.png
          retention-days: 7
          if-no-files-found: warn
      - name: Remove private runner material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/native-private" "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/PiGUIMobile.app"

  ipa:
    needs: [native-build]
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'ipa') &&
      (needs.native-build.result == 'success' || github.event.inputs.app_run_id != '')
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download device app handoff
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: device-app-${{ inputs.app_run_id || github.run_id }}
          path: ${{ runner.temp }}/handoff
          run-id: ${{ inputs.app_run_id || github.run_id }}
      - name: Verify handoff provenance and digest
        run: |
          python3 scripts/ci/verify-handoff.py "$RUNNER_TEMP/handoff/device-app-manifest.json" "$RUNNER_TEMP/handoff/device-app.tar" "${{ inputs.app_run_id || github.run_id }}" "${{ inputs.app_sha || github.sha }}"
          # Same binding: the IPA job may only ship an artifact built from the
          # commit this run reports.
          python3 -c "import json,sys,os;m=json.load(open('$RUNNER_TEMP/handoff/device-app-manifest.json'));sys.exit(0 if m['head_sha']==os.environ['GITHUB_SHA'] else 1)"
          mkdir -p "$RUNNER_TEMP/native-private"
          tar -xf "$RUNNER_TEMP/handoff/device-app.tar" -C "$RUNNER_TEMP"
      - name: Package and verify final device IPA in private staging
        id: ipa
        run: bash scripts/ci/run-step.sh ipa bash scripts/ci/package-ipa.sh "$RUNNER_TEMP/PiGUIMobile.app"
      - name: M6 distribution drafts — version detect, upgrade compat, SideStore source, release draft
        id: m6
        if: success() && steps.ipa.outputs.result == 'passed'
        run: |
          set -euo pipefail
          mkdir -p artifacts/distribution
          # 1. Version detection: IPA identity cross-checked against the
          #    repository source of truth (app.json).
          python3 scripts/ci/version-detect.py artifacts/ipa/PiGUIMobile-unsigned.ipa app.json artifacts/distribution/version-report.json
          IPA_SHA="$(shasum -a 256 artifacts/ipa/PiGUIMobile-unsigned.ipa | awk '{print $1}')"
          IPA_SIZE="$(stat -f%z artifacts/ipa/PiGUIMobile-unsigned.ipa)"
          TAG="v$(python3 -c "import json;print(json.load(open('artifacts/distribution/version-report.json'))['ipaVersion'])")+build$(python3 -c "import json;print(json.load(open('artifacts/distribution/version-report.json'))['ipaBuildNumber'])")"
          # 2. Upgrade compatibility structural verification. Until the first
          #    authorized release exists there is no committed baseline, so the
          #    pipeline exercises the checker against a synthetic one-build-older
          #    baseline derived from THIS run's verified reports — proving the
          #    wiring executes end-to-end. Genuine regression detection across
          #    real releases is covered by the unit suite's paired fixtures and
          #    activates automatically once a baseline lands in the repo.
          python3 - "$RUNNER_TEMP/baseline-version.json" <<'EOF'
          import json, sys
          report = json.load(open('artifacts/distribution/version-report.json'))
          report['ipaBuildNumber'] = report['ipaBuildNumber'] - 1
          json.dump(report, open(sys.argv[1], 'w'))
EOF
          python3 scripts/ci/upgrade-compat.py "$RUNNER_TEMP/baseline-version.json" artifacts/distribution/version-report.json artifacts/ipa/verification.json artifacts/ipa/verification.json artifacts/distribution/upgrade-compat.json
          # 3. SideStore source draft — artifact-only, never published.
          python3 scripts/ci/sidestore-source.py "$(python3 -c "import json;print(json.load(open('artifacts/distribution/version-report.json'))['ipaVersion'])")" "$(python3 -c "import json;print(json.load(open('artifacts/distribution/version-report.json'))['ipaBuildNumber'])")" "$IPA_SHA" "$IPA_SIZE" "$TAG" artifacts/distribution/sidestore-source.json
          # 4. Release draft — bound to exactly the verified bytes.
          python3 scripts/ci/release-draft.py artifacts/ipa/PiGUIMobile-unsigned.ipa artifacts/ipa/verification.json artifacts/distribution/version-report.json artifacts/distribution/upgrade-compat.json artifacts/distribution/sidestore-source.json artifacts/distribution
      - name: Collect only sanitized synthetic evidence
        id: evidence
        if: always()
        run: python3 scripts/ci/collect-evidence.py
      - name: Upload verified final IPA only
        if: success() && steps.ipa.outputs.result == 'passed'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-device-ipa-${{ github.run_id }}
          path: |
            artifacts/ipa/PiGUIMobile-unsigned.ipa
            artifacts/ipa/verification.json
            artifacts/ipa/SHA256SUMS
            artifacts/distribution/version-report.json
            artifacts/distribution/upgrade-compat.json
            artifacts/distribution/sidestore-source.json
            artifacts/distribution/release-draft.json
            artifacts/distribution/release-notes.md
          retention-days: 7
          if-no-files-found: error
      - name: Upload explicit synthetic evidence whitelist
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evidence-ipa-${{ github.run_id }}
          path: |
            artifacts/reports/steps.json
            artifacts/reports/diagnostics.json
            artifacts/reports/environment.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove private runner material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/native-private" "$RUNNER_TEMP/handoff" "$RUNNER_TEMP/PiGUIMobile.app"

  evidence:
    needs: [native-build, sim-acceptance, ipa]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download every sanitized evidence artifact from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: evidence-*-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          merge-multiple: false
      - name: Merge sanitized evidence into the canonical artifact tree
        run: python3 scripts/ci/merge-evidence.py "$RUNNER_TEMP/evidence" artifacts
      - name: Upload explicit synthetic evidence whitelist
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: m-1-ios-${{ github.run_id }}
          path: |
            artifacts/reports/steps.json
            artifacts/reports/diagnostics.json
            artifacts/reports/environment.json
            artifacts/screenshots/iphone/00-shell-home.png
            artifacts/screenshots/iphone/01-native-glass.png
            artifacts/screenshots/iphone/02-interactions.png
            artifacts/screenshots/iphone/03-navigation.png
            artifacts/screenshots/iphone/04-keyboard-visible.png
            artifacts/screenshots/iphone/05-native-motion.png
            artifacts/screenshots/iphone/07-shell-sessions.png
            artifacts/screenshots/iphone/08-shell-conversation.png
            artifacts/screenshots/iphone/09-approvals.png
            artifacts/screenshots/iphone/10-approval-detail.png
            artifacts/screenshots/iphone/dark/home.png
            artifacts/screenshots/iphone/dark/conversation.png
            artifacts/screenshots/iphone/dark/appearance.png
            artifacts/screenshots/iphone/accessibility/home.png
