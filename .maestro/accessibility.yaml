appId: io.github.hyj1817.piguimobile
name: Native opaque accessibility fallback
---
# Reduce Transparency + Dynamic Type: AX-query-free variant.
- launchApp:
    clearState: true
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 4000) {}
- takeScreenshot: ${SCREENSHOT_DIR}/home
- openLink:
    link: "piguimobile://probe"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 3000) {}
- takeScreenshot: ${SCREENSHOT_DIR}/reduce-transparency
- swipe:
    direction: UP
- swipe:
    direction: UP
- takeScreenshot: ${SCREENSHOT_DIR}/dynamic-type
