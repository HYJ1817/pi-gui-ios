appId: io.github.hyj1817.piguimobile
name: Native shell and infrastructure interactions
---
# M2 shell — AX-query-free variant. Every navigation uses the app's own deep
# links or percentage coordinate taps/swipes; nothing queries the accessibility
# tree (upstream iOS 26.5 driver teardown, Maestro#3538).
- launchApp:
    clearState: true
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 4000) {}
- takeScreenshot: ${SCREENSHOT_DIR}/00-shell-home
# Project → Sessions via deep link (detail column on iPad).
- openLink:
    link: "piguimobile://project/project-a0001"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 2500) {}
- takeScreenshot: ${SCREENSHOT_DIR}/07-shell-sessions
# Session → Conversation push.
- openLink:
    link: "piguimobile://session/session-s0001/conversation-c001"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 2500) {}
- takeScreenshot: ${SCREENSHOT_DIR}/08-shell-conversation
# Infrastructure probe (native glass + interactions).
- openLink:
    link: "piguimobile://probe"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 3000) {}
- takeScreenshot: ${SCREENSHOT_DIR}/01-native-glass
# Native menu (top-right Menu button, iPhone header) via coordinate tap.
- tapOn:
    point: "88%,6%"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 1500) {}
- takeScreenshot: ${SCREENSHOT_DIR}/06-native-menu
# Dismiss the menu: tap the middle of the dimmed backdrop.
- tapOn:
    point: "50%,50%"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 1200) {}
# Scroll to the label input and focus it by coordinate (no AX tap needed).
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn:
    point: "50%,55%"
- inputText: "CI synthetic device"
- takeScreenshot: ${SCREENSHOT_DIR}/04-keyboard-visible
- hideKeyboard
- swipe:
    direction: UP
# Demo toggle sits under the input; the same row hits the switch area.
- tapOn:
    point: "80%,45%"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 800) {}
- takeScreenshot: ${SCREENSHOT_DIR}/02-interactions
- swipe:
    direction: UP
# "Run native animation" button.
- tapOn:
    point: "50%,58%"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 1200) {}
- swipe:
    direction: UP
# "Verify native gesture" button.
- tapOn:
    point: "50%,58%"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 800) {}
- takeScreenshot: ${SCREENSHOT_DIR}/05-native-motion
- swipe:
    direction: UP
- swipe:
    direction: UP
# "Infrastructure details" → Diagnostics screen.
- tapOn:
    point: "50%,68%"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 2500) {}
- takeScreenshot: ${SCREENSHOT_DIR}/03-navigation
