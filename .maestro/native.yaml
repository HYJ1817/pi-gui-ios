appId: io.github.hyj1817.piguimobile
name: Native infrastructure interactions
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Native Liquid Glass"
    timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/01-native-glass
- tapOn: "Open native menu"
- assertVisible: "Show diagnostic"
- takeScreenshot: ${SCREENSHOT_DIR}/06-native-menu
- tapOn: "Show diagnostic"
- scrollUntilVisible:
    element:
      id: "device-label"
    direction: DOWN
- tapOn:
    id: "device-label"
- inputText: "CI synthetic device"
- extendedWaitUntil:
    visible: "Keyboard state: visible"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/04-keyboard-visible
- hideKeyboard
- extendedWaitUntil:
    visible: "Keyboard state: hidden"
    timeout: 10000
- assertVisible: "Preview label: CI synthetic device"
- scrollUntilVisible:
    element:
      id: "demo-toggle"
    direction: DOWN
- tapOn:
    id: "demo-toggle"
- assertVisible: "Demo preference: on"
- assertVisible: "Native menu confirmed"
- takeScreenshot: ${SCREENSHOT_DIR}/02-interactions
- scrollUntilVisible:
    element:
      id: "run-animation"
    direction: DOWN
- tapOn:
    id: "run-animation"
- scrollUntilVisible:
    element:
      id: "animation-result"
    direction: DOWN
- extendedWaitUntil:
    visible: "Animation completed"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "native-gesture"
    direction: DOWN
- tapOn:
    id: "native-gesture"
- scrollUntilVisible:
    element:
      id: "gesture-result"
    direction: DOWN
- assertVisible: "Native gesture confirmed"
- takeScreenshot: ${SCREENSHOT_DIR}/05-native-motion
- scrollUntilVisible:
    element:
      id: "open-diagnostics"
    direction: DOWN
- tapOn:
    id: "open-diagnostics"
- assertVisible: "Native navigation works"
- assertVisible: "Remote access: disabled"
- takeScreenshot: ${SCREENSHOT_DIR}/03-navigation
- tapOn: "Back"
- scrollUntilVisible:
    element:
      id: "scroll-end"
    direction: DOWN
- assertVisible: "End of native validation screen"
