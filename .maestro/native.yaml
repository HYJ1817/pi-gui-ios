appId: io.github.hyj1817.piguimobile
name: Native shell and infrastructure interactions
---
# M2 shell: the app entry is the Projects home (stacked on iPhone, detail column on iPad split).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Your agents"
    timeout: 30000
- assertVisible: "Projects"
- assertVisible: "Pi GUI Mobile"
- takeScreenshot: ${SCREENSHOT_DIR}/00-shell-home
# Project → Sessions push (detail column on iPad).
- tapOn:
    id: "project-project-a0001"
- extendedWaitUntil:
    visible: "Synthetic sessions for this project"
    timeout: 10000
- assertVisible: "App shell layout"
- takeScreenshot: ${SCREENSHOT_DIR}/07-shell-sessions
# Session → Conversation push.
- tapOn:
    id: "session-session-s0001"
- extendedWaitUntil:
    visible: "Offline conversation preview"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/08-shell-conversation
# Back to Sessions, then Home.
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Synthetic sessions for this project"
    timeout: 10000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Your agents"
    timeout: 10000
# Enter the infrastructure probe (M−1 native capability lab) via the home quick link.
- tapOn:
    id: "nav-probe"
- extendedWaitUntil:
    visible: "Native Liquid Glass"
    timeout: 30000
- takeScreenshot: ${SCREENSHOT_DIR}/01-native-glass
- tapOn: "Open native menu"
- assertVisible: "Show diagnostic"
- takeScreenshot: ${SCREENSHOT_DIR}/06-native-menu
- tapOn: "Show diagnostic"
- scrollUntilVisible:
    element:
      id: "device-label"
    direction: DOWN
- tapOn:
    id: "device-label"
- inputText: "CI synthetic device"
- extendedWaitUntil:
    visible: "Keyboard state: visible"
    timeout: 10000
- takeScreenshot: ${SCREENSHOT_DIR}/04-keyboard-visible
- hideKeyboard
- extendedWaitUntil:
    visible: "Keyboard state: hidden"
    timeout: 10000
- assertVisible: "Preview label: CI synthetic device"
- scrollUntilVisible:
    element:
      id: "demo-toggle"
    direction: DOWN
- tapOn:
    id: "demo-toggle"
- assertVisible: "Demo preference: on"
- assertVisible: "Native menu confirmed"
- takeScreenshot: ${SCREENSHOT_DIR}/02-interactions
- scrollUntilVisible:
    element:
      id: "run-animation"
    direction: DOWN
- tapOn:
    id: "run-animation"
- scrollUntilVisible:
    element:
      id: "animation-result"
    direction: DOWN
- extendedWaitUntil:
    visible: "Animation completed"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "native-gesture"
    direction: DOWN
- tapOn:
    id: "native-gesture"
- scrollUntilVisible:
    element:
      id: "gesture-result"
    direction: DOWN
- assertVisible: "Native gesture confirmed"
- takeScreenshot: ${SCREENSHOT_DIR}/05-native-motion
- scrollUntilVisible:
    element:
      id: "open-diagnostics"
    direction: DOWN
- tapOn:
    id: "open-diagnostics"
- assertVisible: "Native navigation works"
- assertVisible: "Remote access: disabled"
- takeScreenshot: ${SCREENSHOT_DIR}/03-navigation
- tapOn: "Back"
- scrollUntilVisible:
    element:
      id: "scroll-end"
    direction: DOWN
- assertVisible: "End of native validation screen"
