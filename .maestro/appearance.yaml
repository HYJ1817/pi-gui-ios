appId: io.github.hyj1817.piguimobile
name: Native appearance capture
---
# Dark/system appearance: AX-query-free variant — deep links + fixed sleeps.
- launchApp:
    clearState: true
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 4000) {}
- takeScreenshot: ${SCREENSHOT_DIR}/home
- openLink:
    link: "piguimobile://probe"
- evalScript: |
    var __t = Date.now(); while (Date.now() - __t < 3000) {}
- takeScreenshot: ${SCREENSHOT_DIR}/appearance
